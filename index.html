<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
<title>Talent 360 — One connected prototype</title>
<style>
:root{--ink:#111513;--ink2:#24302b;--muted:#68746e;--canvas:#edf3ef;--paper:#fff;--line:#dfe8e2;--lime:#9fe870;--blue:#3f6fff}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:14px/1.5 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--canvas)}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.shell{display:grid;grid-template-columns:238px minmax(0,1fr);height:100dvh;overflow:hidden}
.sidebar{display:flex;flex-direction:column;background:var(--ink);color:#ecf3ec;min-height:0;padding:23px 13px 18px;z-index:25}
.brand{display:flex;gap:11px;align-items:center;padding:0 11px 30px}.mark{height:37px;width:37px;background:var(--lime);color:var(--ink);border-radius:12px;display:grid;place-items:center;font-size:23px;letter-spacing:-2px;font-weight:950;flex-shrink:0}.brand-name{font-size:17px;font-weight:850;letter-spacing:-.6px;line-height:1.06}.brand-small{display:block;font-size:11px;color:#a4b7a9;font-weight:500;letter-spacing:0;margin-top:6px}
.nav-eyebrow{font-size:10px;letter-spacing:1.5px;font-weight:850;text-transform:uppercase;color:#8e9d94;padding:0 13px;margin:5px 0 11px}.nav-list{display:flex;flex-direction:column;gap:5px}
.nav-item{border:0;background:transparent;color:#c0cdc2;border-radius:11px;width:100%;min-height:56px;display:flex;gap:13px;align-items:center;text-align:left;padding:10px 12px;transition:background .15s,color .15s}
.nav-item:hover{background:#26312a;color:white}.nav-item[aria-current="page"]{background:var(--lime);color:var(--ink)}.nav-item svg{flex-shrink:0}.nav-copy{min-width:0;display:flex;flex-direction:column;gap:3px}.nav-title{font-size:13px;font-weight:800;line-height:1.1}.nav-sub{font-size:10.5px;color:#98a99b;font-weight:580;line-height:1.2}.nav-item[aria-current="page"] .nav-sub{color:#335a28}
.rail-bottom{margin-top:auto;padding:14px 12px 1px;border-top:1px solid #354139;color:#9aaa9b;font-size:11px;line-height:1.55}.synthetic-mark{display:flex;align-items:center;gap:8px;margin-top:12px}.synthetic-mark:before{content:"";width:7px;height:7px;background:var(--lime);border-radius:50%}
.main{min-width:0;min-height:0;display:flex;flex-direction:column}.topbar{height:68px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 29px;gap:15px;z-index:20}.trail{display:flex;align-items:center;gap:10px;min-width:0}.trail-light{font-size:12px;color:#79877d;font-weight:600}.trail-slash{color:#b9c5bb}.current-title{font-size:13px;font-weight:830;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.workspace-role{font-size:11px;color:#718175}.right-meta{display:flex;align-items:center;gap:11px;white-space:nowrap}.data-label{color:#5f7461;border:1px solid #dce6de;background:#f5f9f5;border-radius:999px;font-size:10.5px;font-weight:750;padding:6px 10px}.persona-avatar{width:32px;height:32px;border-radius:10px;background:#e8f7de;color:#315e2f;display:grid;place-items:center;font-size:11px;font-weight:850}
.view-area{flex:1;min-height:0;position:relative;background:var(--canvas)}.app-frame{position:absolute;inset:0;border:0;width:100%;height:100%;display:block;background:var(--canvas)}.app-frame[hidden]{display:none!important}
.mobile-nav-button{display:none;border:0;background:#f1f6f2;height:38px;width:38px;border-radius:10px;align-items:center;justify-content:center;color:var(--ink)}.mobile-backdrop{display:none}
@media(max-width:1040px){.shell{grid-template-columns:77px minmax(0,1fr)}.sidebar{padding:21px 9px}.brand{padding:0 0 30px;justify-content:center}.brand>div:last-child,.nav-eyebrow,.nav-copy,.rail-bottom{display:none}.nav-item{justify-content:center;padding:13px 9px;min-height:50px}.topbar{padding:0 20px}}
@media(max-width:680px){.shell{display:block}.main{height:100dvh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:min(280px,83vw);padding:25px 13px;transform:translateX(-104%);transition:transform .22s ease;box-shadow:18px 0 40px #11151316}.sidebar.is-open{transform:translateX(0)}.sidebar .brand{padding:0 11px 30px;justify-content:flex-start}.sidebar .brand>div:last-child,.sidebar .nav-eyebrow,.sidebar .nav-copy,.sidebar .rail-bottom{display:block}.sidebar .nav-item{justify-content:flex-start;min-height:57px;padding:10px 12px}.sidebar .rail-bottom{display:block}.topbar{height:56px;padding:0 12px;gap:9px}.mobile-nav-button{display:flex}.trail-light,.trail-slash,.workspace-role,.persona-avatar{display:none}.data-label{font-size:9px;padding:5px 7px}.current-title{font-size:13px}.mobile-backdrop.on{display:block;position:fixed;inset:0;background:#07170d90;z-index:24}.view-area{height:calc(100dvh - 56px)} }
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head>

const VIEWS={self:{label:'Personal growth',role:'Self',avatar:'AM',hash:'personal-growth'},lead:{label:'Team performance',role:'Lead',avatar:'SR',hash:'team-performance'},matrix:{label:'Competency mapping',role:'People Partner / Senior Lead',avatar:'PP',hash:'competency-mapping'},explorer:{label:'People explorer',role:'People Partner',avatar:'PP',hash:'people-explorer'}};
const KEYS=Object.keys(VIEWS);
function decode64(str){const bytes=Uint8Array.from(atob(str),ch=>ch.charCodeAt(0));return new TextDecoder('utf-8').decode(bytes)}
function getKey(){const hash=decodeURIComponent(location.hash.slice(1));return KEYS.find(k=>hash===VIEWS[k].hash)||'self'}
let active=null;
let sharedWiser={updates:[],goals:[]};let sharedLead={feedback:[]};
function notifyFrame(key){const f=document.querySelector('[data-frame=\"'+key+'\"]');if(!f?.dataset.loaded)return;try{if(key==='self')f.contentWindow.postMessage({type:'T360_RECEIVE_LEAD',feedback:sharedLead.feedback},'*');if(key==='lead')f.contentWindow.postMessage({type:'T360_RECEIVE_WISER',updates:sharedWiser.updates},'*')}catch(e){}}
window.addEventListener('message',e=>{const d=e.data;if(!d||typeof d!=='object')return;const f=[...document.querySelectorAll('.app-frame')].find(x=>x.contentWindow===e.source);if(!f)return;if(d.type==='T360_WISER_CHANGED'&&f.dataset.frame==='self'&&Array.isArray(d.updates)){sharedWiser={updates:d.updates,goals:d.goals||[]};notifyFrame('lead')}if(d.type==='T360_LEAD_CHANGED'&&f.dataset.frame==='lead'&&Array.isArray(d.feedback)){sharedLead={feedback:d.feedback};notifyFrame('self')}});
function closeMenu(){document.getElementById('sidebar').classList.remove('is-open');document.getElementById('backdrop').classList.remove('on');document.getElementById('mobile-menu').setAttribute('aria-expanded','false')}
function navigate(key,{history=true}={}){
 if(!VIEWS[key])key='self';
 const newframe=document.querySelector('[data-frame="'+key+'"]');
 if(!newframe.dataset.loaded){newframe.srcdoc=decode64(SOURCES[key]);newframe.dataset.loaded='1'}
 KEYS.forEach(k=>{const el=document.querySelector('[data-frame="'+k+'"]');el.hidden=k!==key;el.setAttribute('aria-hidden',String(k!==key));document.querySelector('[data-view="'+k+'"]').setAttribute('aria-current',k===key?'page':'false')});
 const v=VIEWS[key];document.getElementById('current-title').textContent=v.label;document.getElementById('role-label').textContent=v.role;document.getElementById('persona-avatar').textContent=v.avatar;document.title='Talent 360 — '+v.label;
 if(history&&location.hash!=='#'+v.hash)location.hash=v.hash;
 active=key;closeMenu();
 try{const child=newframe.contentWindow;child?.dispatchEvent(new Event('talent360-resume'))}catch(e){};notifyFrame(key)
}
document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>navigate(button.dataset.view)));
document.getElementById('mobile-menu').addEventListener('click',()=>{const open=document.getElementById('sidebar').classList.toggle('is-open');document.getElementById('backdrop').classList.toggle('on',open);document.getElementById('mobile-menu').setAttribute('aria-expanded',String(open))});
document.getElementById('backdrop').addEventListener('click',closeMenu);
window.addEventListener('hashchange',()=>{const key=getKey();if(key!==active)navigate(key,{history:false})});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
document.querySelectorAll('.app-frame').forEach(f=>f.addEventListener('load',()=>{if(f.dataset.frame===active){try{f.contentWindow?.dispatchEvent(new Event('talent360-resume'))}catch(e){};notifyFrame(f.dataset.frame)}}));
navigate(getKey(),{history:false});
</script></body></html>
